name: SmartSSI
options:
  bundleIdPrefix: xyz.chromedao
  deploymentTarget:
    iOS: "17.0"
targets:
  SmartSSI:
    type: application
    platform: iOS
    sources:
      - SmartSSI
      - Generated/smart_ssi_mobile.swift
    dependencies:
      - framework: SmartSSICore.xcframework
        embed: false
    info:
      path: SmartSSI/Info.plist
      properties:
        CFBundleDisplayName: Smart-SSI
        NSAppleMusicUsageDescription: Smart-SSI reads the artist and genre of your recently played tracks to make your listener badge. Song titles and albums stay on your phone.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only standard encryption (HTTPS, signatures for authentication): exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Public client ID of the Chrome DAO GitHub OAuth app (device flow enabled). Not a secret.
        GitHubClientID: Ov23liCy3XyNiuJAZRsL
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Smart-SSI connects to a development notary and issuer on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.chromedao.smartssi
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        OTHER_LDFLAGS: "-lc++"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
      configs:
        Debug:
          "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
