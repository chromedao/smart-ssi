[package]
name = "smart-ssi-mobile"
version = "0.1.0"
edition = "2024"
publish = false
description = "Smart-SSI prover exposed to Swift and Kotlin with UniFFI"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "smart_ssi_mobile"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
smart-ssi-prover = { path = "../../prover" }
tlsn = { path = "../../vendor/tlsn/crates/tlsn" }
anyhow = "1.0"
bincode = "1.3"
bs58 = "0.5"
ed25519-dalek = "2"
getrandom = "0.2"
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1.38", features = ["rt-multi-thread", "net"] }
uniffi = { version = "0.32", features = ["cli"] }
