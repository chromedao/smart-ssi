[package]
name = "smart-ssi-prover"
version = "0.1.0"
edition = "2024"
publish = false
description = "Smart-SSI prototype: prove facts from a real HTTPS API with TLSNotary"

[dependencies]
tlsn = { path = "../vendor/tlsn/crates/tlsn" }
tlsn-formats = { path = "../vendor/tlsn/crates/formats" }

anyhow = "1.0"
bincode = "1.3"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1.1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["full"] }
k256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "macros", "net", "io-std", "fs"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

